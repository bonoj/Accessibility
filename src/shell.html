<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Accessibility — executable research into accessible human–model construction.">
  <title>Accessibility</title>
  <!-- ACCESSIBILITY:STYLE -->
</head>
<body>
  <main id="app">
    <section id="world" aria-label="Spatial workstation. Drag to orbit. Pinch or use the mouse wheel to change distance."></section>
  </main>
  <template id="entity-surface-template">
    <section class="entity-card" hidden>
    <header class="surface-header">
      <div>
        <p class="surface-kicker">Scene entity</p>
        <h1 data-surface-role="title">Ball</h1>
      </div>
      <div class="surface-header-actions">
        <button data-surface-role="collapse" type="button" aria-expanded="true" aria-controls="surface-body">Collapse</button>
        <button data-surface-role="dismiss" type="button">Dismiss</button>
      </div>
    </header>

    <div data-surface-role="body">
      <p data-surface-role="description">A simple object in the scene.</p>

      <div class="surface-controls" data-surface-role="controls">
        <label>
          Text quantity
          <select data-surface-role="quantity">
            <option value="short">Short</option>
            <option value="medium">Medium</option>
            <option value="lots">Lots</option>
          </select>
        </label>

        <label>
          Font size
          <select data-surface-role="font-size">
            <option value="normal">Normal</option>
            <option value="large">Large</option>
            <option value="huge">Huge</option>
          </select>
        </label>

        <label>
          Amount <output data-surface-role="amount-value">50</output>
          <input data-surface-role="slider" type="range" min="0" max="100" value="50">
        </label>

        <div class="surface-actions">
          <button data-surface-role="action" type="button">Do something</button>
          <button data-surface-role="expand" type="button" aria-pressed="false">Expand</button>
        </div>
        <output data-surface-role="status" aria-live="polite">Nothing has happened yet.</output>
      </div>
    </div>
    </section>
  </template>
  <aside id="debug-tools" aria-label="Temporary build controls">
    <label id="variant-control">
      Surface
      <select id="surface-variant" aria-label="Experimental surface variant">
        <option value="float">Float</option>
        <option value="edge">Edge</option>
        <option value="center">Center</option>
        <option value="sheet">Sheet</option>
      </select>
    </label>
    <output id="fps-counter" aria-label="Frames per second">fps …</output>
    <output id="build-id">build …</output>
    <button id="debug-refresh" type="button">Refresh</button>
  </aside>
  <div id="diagnostics" role="alert" hidden></div>
  <script>globalThis.__ACCESSIBILITY_BUILD__ = "{{BUILD_COMMIT}}";</script>
  <!-- ACCESSIBILITY:SCRIPT -->
</body>
</html>
