name: Build candidate

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-candidate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accessibility-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build candidate
        run: npm run build

      - name: Verify self-contained artifact exists
        run: |
          test -s dist/index.html
          ! grep -E '<(script|link)[^>]+(src|href)=' dist/index.html

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-candidate-${{ github.sha }}
          path: dist/index.html
          if-no-files-found: error
          retention-days: 30

      - name: Publish web-addressable candidate
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "candidates/$SOURCE_SHA"
          cp dist/index.html "candidates/$SOURCE_SHA/index.html"
          printf '%s\n' "$SOURCE_SHA" > "candidates/$SOURCE_SHA/SOURCE_COMMIT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "candidates/$SOURCE_SHA"
          git commit -m "Build candidate $SOURCE_SHA"
          git pull --rebase origin main
          git push origin HEAD:main
