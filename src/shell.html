<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Accessibility — executable research into accessible human–model construction.">
  <title>Accessibility</title>
  <!-- ACCESSIBILITY:STYLE -->
</head>
<body>
  <main id="app" data-allocation="shared">
    <section id="world" aria-label="Construction world"></section>
    <section id="language" aria-label="Language and accessible presentation">
      <p class="eyebrow">ACCESSIBILITY · CAMERA WITNESS</p>
      <h1>Cameras are entities.</h1>
      <p>The 3D view is a realization of ECS state. Change cameras or presentation allocation; semantic camera state survives.</p>

      <div class="controls">
        <label for="camera-select">Active camera</label>
        <select id="camera-select"></select>

        <label for="allocation">Presentation allocation</label>
        <select id="allocation">
          <option value="world">3D foreground</option>
          <option value="shared" selected>Shared</option>
          <option value="language">Language foreground</option>
        </select>

        <button id="refresh-state" type="button">Refresh semantic state</button>
      </div>

      <details open>
        <summary>Inspect ECS camera state</summary>
        <pre id="camera-state" aria-live="polite"></pre>
      </details>

      <p class="build">build {{BUILD_COMMIT}}</p>
    </section>
  </main>
  <div id="diagnostics" role="alert" hidden></div>
  <script>globalThis.__ACCESSIBILITY_BUILD__ = "{{BUILD_COMMIT}}";</script>
  <!-- ACCESSIBILITY:SCRIPT -->
</body>
</html>
