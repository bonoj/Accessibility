name: Promote candidate

on:
  push:
    branches: [main]
    paths:
      - ".promotion/candidate"
  workflow_dispatch:
    inputs:
      candidate:
        description: "40-character source commit SHA of the accepted candidate"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: accessibility-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve accepted candidate
        id: candidate
        env:
          DISPATCH_CANDIDATE: ${{ inputs.candidate }}
        run: |
          if [ -n "$DISPATCH_CANDIDATE" ]; then
            CANDIDATE="$DISPATCH_CANDIDATE"
          else
            CANDIDATE="$(tr -d '[:space:]' < .promotion/candidate)"
          fi
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Find immutable candidate artifact
        id: artifact
        uses: actions/github-script@v7
        env:
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const name = `accessibility-candidate-${process.env.CANDIDATE}`;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, name, per_page: 100 }
            );
            const artifact = artifacts.find(a => !a.expired && a.name === name);
            if (!artifact) core.setFailed(`No live immutable artifact named ${name}`);
            core.setOutput("id", artifact.id);

      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          path: accepted
          github-token: ${{ github.token }}

      - name: Promote exact bytes
        env:
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          test -s accepted/index.html
          grep -Fq "$CANDIDATE" accepted/index.html
          cp accepted/index.html index.html
          cmp --silent accepted/index.html index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Candidate is already stable."
            exit 0
          fi
          git commit -m "Promote candidate $CANDIDATE"
          git pull --rebase origin main
          git push origin HEAD:main
