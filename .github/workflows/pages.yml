name: Publish Pages

on:
  workflow_run:
    workflows: ["Build candidate"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: accessibility-pages
  cancel-in-progress: true

jobs:
  publish:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve stable and candidate identities
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "stable_ref=main" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
            echo "candidate_run=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "candidate_sha=" >> "$GITHUB_OUTPUT"
            echo "candidate_run=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout stable release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.stable_ref }}
          path: repo

      - name: Assemble Pages surface
        run: |
          mkdir -p site
          test -s repo/index.html
          cp repo/index.html site/index.html

      - name: Download exact candidate artifact
        if: steps.refs.outputs.candidate_run != ''
        uses: actions/download-artifact@v4
        with:
          name: accessibility-candidate-${{ steps.refs.outputs.candidate_sha }}
          path: site/preview
          run-id: ${{ steps.refs.outputs.candidate_run }}
          github-token: ${{ github.token }}

      - name: Preserve preview identity
        if: steps.refs.outputs.candidate_run != ''
        env:
          CANDIDATE_SHA: ${{ steps.refs.outputs.candidate_sha }}
        run: |
          test -s site/preview/index.html
          printf '%s\n' "$CANDIDATE_SHA" > site/preview/SOURCE_COMMIT
          printf '%s\n' "$CANDIDATE_SHA" > site/PREVIEW_SOURCE_COMMIT

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages surface
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
